name: Build StArray Port

# Compiles StArray-Port/Source against the REAL StArray.ModManager release assemblies
# (modmanager-android 1.0.6) plus the analyzer built from the StArray source tree, then publishes
# the resulting DLL back to StArray-Port/Build/ so it can be picked up for device testing.

on:
  push:
    branches:
      - arena/b9d8301a-firstpersonmodsonicdreamteam
      - main
    paths:
      - 'StArray-Port/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch StArray release assemblies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p StArray-Port/lib
          gh release download 1.0.6 \
            --repo StArraySharp/StArray.ModManager \
            --pattern 'modmanager-android.zip' \
            --dir /tmp/starray-release
          unzip -o -q /tmp/starray-release/modmanager-android.zip -d /tmp/starray-release/extracted
          find /tmp/starray-release/extracted -name '*.dll' | head -40

      - name: Stage StArray.ModManager.dll and ImGui.NET.dll
        run: |
          set -euo pipefail
          MANAGER=$(find /tmp/starray-release/extracted -name 'StArray.ModManager.dll' | head -1)
          IMGUI=$(find /tmp/starray-release/extracted -name 'ImGui.NET.dll' | head -1)
          test -n "$MANAGER"
          test -n "$IMGUI"
          cp "$MANAGER" StArray-Port/lib/StArray.ModManager.dll
          cp "$IMGUI" StArray-Port/lib/ImGui.NET.dll
          ls -la StArray-Port/lib

      - name: Build StArray analyzer from source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/StArraySharp/StArray.ModManager.git /tmp/starray-src
          dotnet build /tmp/starray-src/StArray.ModManager.Analyzer/StArray.ModManager.Analyzer.csproj \
            -c Release -o /tmp/starray-analyzer
          cp /tmp/starray-analyzer/StArray.ModManager.Analyzer.dll StArray-Port/lib/
          ls -la StArray-Port/lib

      - name: Build mod (Release, ARM64)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet build StArray-Port/Source/FirstPersonCameraMod.csproj \
            -c Release -p:Platform=ARM64 \
            2>&1 | tee StArray-Port/Reports/BuildLog.txt

      # Compiler diagnostics as check annotations — readable without downloading the artifact.
      - name: Surface compiler diagnostics
        if: always()
        run: |
          grep -E "error [A-Z]+[0-9]+|warning CS" StArray-Port/Reports/BuildLog.txt | sort -u | head -25 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | sed 's/\[.*//' | tr -d '\r')"
          done

      - name: Report result to commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            STATUS="BUILD SUCCESS"
          else
            STATUS="BUILD FAILED"
          fi
          {
            echo "### StArray port build: $STATUS"
            echo ""
            echo '```'
            tail -c 50000 StArray-Port/Reports/BuildLog.txt
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/comment.md > /dev/null || echo "comment failed"

      - name: Publish DLL into the repo
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          SRC=$(find StArray-Port/Source/bin -name 'FirstPersonCameraMod.dll' | head -1)
          test -n "$SRC"
          mkdir -p StArray-Port/Build
          cp "$SRC" StArray-Port/Build/FirstPersonCameraMod.dll

          git config user.name "starray-build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -f StArray-Port/Build/FirstPersonCameraMod.dll StArray-Port/Reports/BuildLog.txt
          git commit -m "build: FirstPersonCameraMod.dll (Release, net10.0, ARM64)" || exit 0

          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            sleep 3
          done
          echo "::warning::could not push built DLL"

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
